<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#05070c">

    <meta name="description"
          content="ADG — Battle Arena">

    <title>⚔️ ADG — Battle Arena</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="battle-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="adg-header">

        <div class="adg-logo">
            ⚔️ <span>ADG</span>
        </div>


        <div
            id="connectionStatus"
            class="connection-status">

            Connecting...

        </div>

    </header>


    <!-- =====================================================
         MAIN BATTLE AREA
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             BATTLE HEADER
             ================================================= -->

        <section class="battle-header">

            <h1>
                ⚔️ BATTLE ARENA
            </h1>


            <div
                id="battlePhase"
                data-battle-phase>

                PREPARING BATTLE...

            </div>


            <p
                id="battleStatus"
                style="margin-top:10px;color:var(--text-muted);">

                Waiting for both players...

            </p>

        </section>


        <!-- =================================================
             BATTLE ARENA
         ================================================= -->

        <section
            id="battleArena"
            class="battle-arena">


            <!-- =============================================
                 PLAYER 1
                 ============================================= -->

            <section
                id="player1BattleTeam"
                class="battle-team">


                <div
                    class="battle-team-title"
                    id="player1Name">

                    PLAYER 1

                </div>


                <!--
                    battle.js creates Player 1 cards here.

                    Both teams are intentionally rendered only
                    after the server enters the Battle phase.
                -->

            </section>


            <!-- =============================================
                 VS
                 ============================================= -->

            <div class="battle-vs">

                VS

            </div>


            <!-- =============================================
                 PLAYER 2
                 ============================================= -->

            <section
                id="player2BattleTeam"
                class="battle-team">


                <div
                    class="battle-team-title"
                    id="player2Name">

                    PLAYER 2

                </div>


                <!--
                    battle.js creates Player 2 cards here.
                -->

            </section>

        </section>


        <!-- =================================================
             BATTLE LOG
             ================================================= -->

        <section
            id="battleLog"
            class="battle-log"
            aria-live="polite"
            aria-label="Battle log">

            <div
                class="battle-log-entry">

                Waiting for battle events...

            </div>

        </section>


        <!-- =================================================
             BATTLE CONTROLS
             ================================================= -->

        <section
            id="battleControls"
            class="roles-actions">

            <!--
                The battle is server controlled.
                No attack buttons are provided to players.
            -->

        </section>


        <!-- =================================================
             SOUND CONTROL
             ================================================= -->

        <div
            class="sound-control"
            style="width:max-content;margin:25px auto 0;">

            <span data-volume-icon>
                🔊
            </span>


            <input
                type="range"
                min="0"
                max="100"
                value="65"
                aria-label="Master volume"
                data-master-volume>


            <span data-volume-value>
                65%
            </span>


            <button
                type="button"
                aria-label="Mute"
                aria-pressed="false"
                data-mute-button>

                🔊

            </button>

        </div>

    </main>


    <!-- =====================================================
         BATTLE RESULT OVERLAY
         ===================================================== -->

    <div
        id="battleResult"
        data-battle-result
        class="hidden">


        <div class="battle-result-content">


            <div
                id="battleResultIcon"
                class="battle-result-icon">

                ⚔️

            </div>


            <h1
                id="battleResultTitle">

                BATTLE FINISHED

            </h1>


            <h2
                id="battleResultWinner">

                Waiting...

            </h2>


            <p
                id="battleResultMessage">

                The battle has ended.

            </p>


            <!-- =============================================
                 RESULT ACTIONS
                 ============================================= -->

            <div class="battle-result-actions">


                <button
                    id="rematchButton"
                    type="button">

                    🔄 REMATCH

                </button>


                <button
                    id="profileButton"
                    type="button">

                    👤 PROFILE

                </button>


                <button
                    id="homeButton"
                    type="button">

                    🏠 HOME

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         POST-MATCH CHARACTER DETAILS
         ===================================================== -->

    <section
        id="matchDetailsSection"
        class="container hidden">


        <div class="page-title">

            <h2>
                📊 MATCH CHARACTER DETAILS
            </h2>

            <p>
                Battle statistics are revealed after the match.
            </p>

        </div>


        <div
            id="matchDetailsContainer"
            data-match-details-container>

            <!--
                battle.js creates post-match statistics here.
            -->

        </div>

    </section>


    <!-- =====================================================
         GLOBAL MESSAGE
         ===================================================== -->

    <div
        id="adgMessage"
        class="adg-message hidden"
        role="status"
        aria-live="polite">

    </div>


    <!-- =====================================================
         SOCKET.IO CLIENT
         ===================================================== -->

    <script
        src="/socket.io/socket.io.js">
    </script>


    <!-- =====================================================
         DATABASE
         ===================================================== -->

    <script
        src="js/database.js">
    </script>


    <!-- =====================================================
         SOUND
         ===================================================== -->

    <script
        src="js/sound.js">
    </script>


    <!-- =====================================================
         BATTLE ENGINE
         ===================================================== -->

    <script
        src="js/battle.js">
    </script>

</body>

</html>
```
