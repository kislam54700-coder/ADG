<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="ADG — Anime Draft Game"
    >

    <title>⚔️ ADG — Anime Draft Game</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="container">

        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <div>

                <div class="logo">
                    ⚔️ ADG
                </div>

                <p class="subtitle">
                    Anime Draft Game
                </p>

            </div>


            <div
                id="connectionStatus"
                class="disconnected"
            >
                Disconnected
            </div>

        </header>


        <!-- =================================================
             LOBBY
             ================================================= -->

        <section class="lobby-card">

            <h1>
                Let's Face To Face
            </h1>

            <p>
                Create a battle or join an opponent
                using a Match Code.
            </p>


            <!-- =================================================
                 PLAYER NAME
                 ================================================= -->

            <div class="form-group">

                <label for="playerName">
                    Player Name
                </label>

                <input
                    id="playerName"
                    type="text"
                    maxlength="24"
                    autocomplete="nickname"
                    placeholder="Enter your name"
                >

            </div>


            <!-- =================================================
                 BATTLE NAME
                 ================================================= -->

            <div class="form-group">

                <label>
                    Anime Battle
                </label>

                <div
                    id="battleName"
                    class="selected-anime"
                >
                    LET'S FACE TO FACE
                </div>

            </div>


            <!-- =================================================
                 CREATE BATTLE
                 ================================================= -->

            <div class="lobby-actions">

                <button
                    id="createMatchButton"
                    type="button"
                    class="primary-btn"
                    disabled
                >
                    ⚔️ Create Battle
                </button>

            </div>


            <!-- =================================================
                 CREATED BATTLE
                 ================================================= -->

            <section
                id="createdBattlePanel"
                class="created-battle-panel hidden"
            >

                <h2>
                    ⚔️ Battle Created
                </h2>

                <p>
                    Give this Match Code to your opponent.
                </p>


                <div class="match-code-box">

                    <span>
                        Match Code
                    </span>

                    <strong id="createdMatchCode">
                        --------
                    </strong>

                </div>


                <div class="match-code-actions">

                    <button
                        id="copyMatchCodeButton"
                        type="button"
                        class="secondary-btn"
                    >
                        📋 Copy Code
                    </button>


                    <button
                        id="cancelMatchButton"
                        type="button"
                        class="warning-btn"
                    >
                        ✕ Cancel Battle
                    </button>

                </div>


                <div
                    id="waitingForOpponent"
                    class="waiting-opponent"
                >
                    ⏳ Waiting for opponent...
                </div>

            </section>


            <!-- =================================================
                 JOIN BATTLE
                 ================================================= -->

            <div
                id="joinBattleSection"
                class="form-group"
            >

                <label for="matchId">
                    Join Existing Battle
                </label>


                <div class="match-join">

                    <input
                        id="matchId"
                        type="text"
                        maxlength="8"
                        autocomplete="off"
                        placeholder="Enter Match Code"
                    >


                    <button
                        id="joinMatchButton"
                        type="button"
                        class="secondary-btn"
                        disabled
                    >
                        Join Battle
                    </button>

                </div>

            </div>


            <!-- =================================================
                 STATUS
                 ================================================= -->

            <div
                id="lobbyStatus"
                class="hidden"
                role="status"
                aria-live="polite"
            ></div>


            <div
                id="adgMessage"
                class="hidden"
                role="alert"
                aria-live="assertive"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         SOCKET.IO CLIENT
         ===================================================== -->

    <script
        src="https://adg-server-t6y1.onrender.com/socket.io/socket.io.js"
    ></script>


    <!-- =====================================================
         DATABASE
         ===================================================== -->

    <script src="js/database.js"></script>


    <!-- =====================================================
         SOUND
         ===================================================== -->

    <script src="js/sound.js"></script>


    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <script src="js/app.js"></script>
    <body class="lobby-page">
</body>

</html>
