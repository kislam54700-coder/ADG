<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>📜 ADG Battle History</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <h1>📜 Battle History</h1>

        <p id="historyStatus">
            Loading battle history...
        </p>


        <!-- =====================================================
             HISTORY CONTROLS
             ===================================================== -->

        <div class="history-controls">

            <button
                id="backBtn"
                type="button">
                ⬅️ Back
            </button>

            <button
                id="clearHistoryBtn"
                type="button">
                🗑️ Clear History
            </button>

        </div>


        <!-- =====================================================
             HISTORY LIST
             ===================================================== -->

        <div
            id="historyContainer"
            class="history-container">
        </div>

    </div>


    <script src="js/history.js"></script>

</body>

</html>
