<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADG Draft</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>ADG Draft</h1>

        <h2 id="animeTitle">Loading...</h2>

        <h3 id="roundCounter">Round 1 / 6</h3>

        <div id="currentPlayer">
            <h3>Player 1 Turn</h3>
        </div>

        <button id="drawBtn">
            🎲 Draw Character
        </button>

        <div class="character-card" id="characterCard">
            Press "Draw Character"
        </div>

        <hr>

        <h3>Player 1 Team (<span id="p1Count">0</span>/6)</h3>
        <ul id="player1Team"></ul>

        <h3>Player 2 Team (<span id="p2Count">0</span>/6)</h3>
        <ul id="player2Team"></ul>

        <button id="nextPhaseBtn" class="hidden">
            Continue →
        </button>

        <button id="backBtn">
            ⬅ Back
        </button>


    </div>


    <script src="js/database.js"></script>
    
    <script src="js/draft.js"></script>


</body>



</html>
