```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="ADG — Battle Arena"
    >

    <title>⚔️ ADG — Battle Arena</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="battle-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="adg-header">

        <div class="adg-logo">
            ⚔️ <span>ADG</span>
        </div>


        <div
            id="connectionStatus"
            class="connection-status"
        >
            Connecting...
        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             BATTLE HEADER
             ================================================= -->

        <section class="battle-header">

            <h1>
                ⚔️ BATTLE ARENA
            </h1>


            <p
                id="gameAnimeTitle"
                class="subtitle"
            >
                One Piece
            </p>


            <div
                id="gameStatus"
                class="game-status active"
            >
                Preparing Battle...
            </div>


            <div id="battleRound">
                Round 1
            </div>

        </section>


        <!-- =================================================
             BATTLE ARENA
             ================================================= -->

        <section class="battle-arena">


            <!-- =============================================
                 PLAYER 1
                 ============================================= -->

            <section class="battle-panel">

                <h2 id="myPlayerName">
                    Player
                </h2>


                <!-- HP -->

                <div class="hp-container">

                    <div class="hp-label">

                        <span>
                            HP
                        </span>

                        <span id="myHpText">
                            100%
                        </span>

                    </div>


                    <div class="hp-track">

                        <div
                            id="myHpBar"
                            class="hp-bar"
                            style="width:100%;"
                        ></div>

                    </div>

                </div>


                <!-- TEAM -->

                <div
                    id="myTeam"
                    class="battle-team"
                >

                    <!-- game.js renders team -->

                </div>

            </section>


            <!-- =============================================
                 VS
                 ============================================= -->

            <div class="battle-vs">
                VS
            </div>


            <!-- =============================================
                 PLAYER 2
                 ============================================= -->

            <section class="battle-panel">

                <h2 id="opponentPlayerName">
                    Opponent
                </h2>


                <!-- HP -->

                <div class="hp-container">

                    <div class="hp-label">

                        <span>
                            HP
                        </span>

                        <span id="opponentHpText">
                            100%
                        </span>

                    </div>


                    <div class="hp-track">

                        <div
                            id="opponentHpBar"
                            class="hp-bar"
                            style="width:100%;"
                        ></div>

                    </div>

                </div>


                <!-- TEAM -->

                <div
                    id="opponentTeam"
                    class="battle-team"
                >

                    <!-- game.js renders opponent team -->

                </div>

            </section>

        </section>


        <!-- =================================================
             BATTLE LOG
             ================================================= -->

        <section class="battle-log-panel">

            <h2>
                📜 Battle Log
            </h2>


            <div
                id="battleLog"
                aria-live="polite"
            >

                <div class="battle-log-entry">
                    Waiting for battle...
                </div>

            </div>

        </section>


        <!-- =================================================
             BATTLE MESSAGE
             ================================================= -->

        <div
            id="battleMessage"
            class="hidden"
            role="status"
            aria-live="polite"
        ></div>


        <div
            id="adgMessage"
            class="hidden"
            role="status"
            aria-live="polite"
        ></div>


        <!-- =================================================
             BATTLE ACTIONS
             ================================================= -->

        <section class="battle-actions">

            <button
                id="leaveBattleButton"
                type="button"
                class="secondary-btn"
            >
                Leave Battle
            </button>

        </section>


        <!-- =================================================
             SOUND CONTROL
             ================================================= -->

        <div
            class="sound-control"
            style="width:max-content;margin:25px auto 0;"
        >

            <span data-volume-icon>
                🔊
            </span>


            <input
                type="range"
                min="0"
                max="100"
                value="65"
                aria-label="Master volume"
                data-master-volume
            >


            <span data-volume-value>
                65%
            </span>


            <button
                type="button"
                aria-label="Mute"
                aria-pressed="false"
                data-mute-button
            >
                🔊
            </button>

        </div>

    </main>


    <!-- =====================================================
         SOCKET.IO
         ===================================================== -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!-- =====================================================
         CHARACTER DATABASE
         ===================================================== -->

    <script
        src="js/database.js"
    ></script>


    <!-- =====================================================
         SOUND
         ===================================================== -->

    <script
        src="js/sound.js"
    ></script>


    <!-- =====================================================
         BATTLE ENGINE
         ===================================================== -->

    <script
        src="js/game.js"
    ></script>

</body>

</html>
