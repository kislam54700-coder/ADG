<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <meta
        name="description"
        content="ADG — Face to Face"
    >

    <title>⚔️ ADG — Role Assignment</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="draft-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="adg-header">

        <div class="adg-logo">
            ⚔️ <span>ADG</span>
        </div>


        <div
            id="connectionStatus"
            class="connection-status"
        >
            Connecting...
        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             MATCH INFORMATION
             ================================================= -->

        <section class="draft-header">

            <h1>
                🎭 ROLE ASSIGNMENT
            </h1>


            <p>
                <span id="animeTitle">
                    Face to Face
                </span>
            </p>


            <!-- MATCH CODE -->

            <div
                id="matchCodeBox"
                class="match-code-box"
            >

                <span class="match-code-label">
                    MATCH CODE
                </span>


                <strong
                    id="matchCode"
                    class="match-code"
                >
                    Loading...
                </strong>


                <button
                    id="copyMatchCodeButton"
                    type="button"
                    class="secondary-btn"
                >
                    📋 Copy
                </button>

            </div>


            <div
                id="roleProgress"
                class="draft-turn waiting"
            >
                0 / 6 Roles Assigned
            </div>


            <p id="roleInstruction">
                Assign all six unique roles to continue.
            </p>

        </section>


        <!-- =================================================
             ROLE ASSIGNMENT
             ================================================= -->

        <section class="draft-panel">

            <div class="draft-header">

                <h2>
                    🏴 Your Team
                </h2>

                <p>
                    Assign one unique role to each character.
                </p>

            </div>


            <div
                id="rolesTeam"
                class="draft-team"
            >

                <!-- roles.js creates the cards -->

            </div>

        </section>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <section class="draft-panel">

            <div class="lobby-actions">

                <button
                    id="backButton"
                    type="button"
                    class="secondary-btn"
                >
                    ← Back
                </button>


                <button
                    id="continueButton"
                    type="button"
                    class="primary-btn"
                    disabled
                >
                    Continue → Battle Arena
                </button>

            </div>

        </section>


        <!-- =================================================
             STATUS
             ================================================= -->

        <div
            id="rolesStatus"
            class="hidden"
            role="status"
            aria-live="polite"
        ></div>


        <div
            id="adgMessage"
            class="hidden"
            role="alert"
            aria-live="assertive"
        ></div>


        <!-- =================================================
             SOUND
             ================================================= -->

        <div
            class="sound-control"
            style="width:max-content;margin:25px auto 0;"
        >

            <span data-volume-icon>
                🔊
            </span>


            <input
                type="range"
                min="0"
                max="100"
                value="65"
                aria-label="Master volume"
                data-adg-volume
            >


            <span data-adg-volume-label>
                65%
            </span>


            <button
                type="button"
                aria-label="Mute"
                aria-pressed="false"
                data-adg-mute
            >
                🔊 Mute
            </button>

        </div>

    </main>


    <!-- =====================================================
         SOCKET.IO
         ===================================================== -->

    <script
        src="https://adg-server-t6y1.onrender.com/socket.io/socket.io.js"
    ></script>


    <!-- =====================================================
         DATABASE
         ===================================================== -->

    <script
        src="js/database.js"
    ></script>


    <!-- =====================================================
         SOUND
         ===================================================== -->

    <script
        src="js/sound.js"
    ></script>


    <!-- =====================================================
         ROLES ENGINE
         ===================================================== -->

         <script src="js/roles.js"></script>
         <body class="roles-page">

</body>

</html>
