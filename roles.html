```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>⚔️ ADG — Role Assignment</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- =====================================================
         ADG ROLE ASSIGNMENT
         ===================================================== -->

    <main class="role-page">

        <!-- HEADER -->
        <header class="role-header">

            <div class="adg-logo">
                ⚔️ ADG
            </div>

            <h1>ROLE ASSIGNMENT</h1>

            <p>
                Assign one role to each character
            </p>

        </header>


        <!-- =================================================
             PLAYER 1
             ================================================= -->

        <section class="player-section player-one">

            <div class="player-title">

                <div>
                    <span class="player-label">
                        PLAYER 1
                    </span>

                    <h2>
                        Your Team
                    </h2>
                </div>

                <span class="role-count"
                      id="player1RoleCount">
                    0 / 6
                </span>

            </div>


            <!-- PLAYER 1 CHARACTERS -->

            <div class="character-grid"
                 id="player1Characters">

                <!--
                    Character cards are generated by roles.js
                -->

            </div>

        </section>


        <!-- =================================================
             PLAYER 2
             ================================================= -->

        <section class="player-section player-two">

            <div class="player-title">

                <div>
                    <span class="player-label">
                        PLAYER 2
                    </span>

                    <h2>
                        Opponent Team
                    </h2>
                </div>

                <span class="role-count"
                      id="player2RoleCount">
                    0 / 6
                </span>

            </div>


            <!-- PLAYER 2 CHARACTERS -->

            <div class="character-grid"
                 id="player2Characters">

                <!--
                    Character cards are generated by roles.js
                -->

            </div>

        </section>


        <!-- =================================================
             ROLE LEGEND
             ================================================= -->

        <section class="role-legend">

            <h3>
                AVAILABLE ROLES
            </h3>

            <div class="role-list">

                <div class="role-item">
                    <span class="role-icon">👑</span>
                    <span class="role-name">Leader</span>
                </div>

                <div class="role-item">
                    <span class="role-icon">⚔️</span>
                    <span class="role-name">Attacker</span>
                </div>

                <div class="role-item">
                    <span class="role-icon">🛡️</span>
                    <span class="role-name">Defender</span>
                </div>

                <div class="role-item">
                    <span class="role-icon">❤️</span>
                    <span class="role-name">Support</span>
                </div>

                <div class="role-item">
                    <span class="role-icon">⭐</span>
                    <span class="role-name">Specialist</span>
                </div>

                <div class="role-item">
                    <span class="role-icon">☠️</span>
                    <span class="role-name">Wildcard</span>
                </div>

            </div>

        </section>


        <!-- =================================================
             STATUS / VALIDATION
             ================================================= -->

        <div class="role-status"
             id="roleStatus">

            Assign all roles to continue.

        </div>


        <!-- =================================================
             CONTINUE
             ================================================= -->

        <div class="continue-container">

            <button
                id="continueBattleBtn"
                class="continue-battle-btn"
                type="button"
                disabled>

                ⚔️ CONTINUE TO BATTLE

            </button>

        </div>

    </main>


    <!-- =====================================================
         ROLE ASSIGNMENT SCRIPT
         ===================================================== -->

   <script src="js/database.js"></script>
   <script src="js/roles.js"></script>
</body>

</html>
```
