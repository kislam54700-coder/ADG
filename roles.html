```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#080a12">

    <meta name="description"
          content="ADG — Role Assignment">

    <title>⚔️ ADG — Role Assignment</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="roles-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="adg-header">

        <div class="adg-logo">
            ⚔️ <span>ADG</span>
        </div>


        <div
            id="connectionStatus"
            class="connection-status">

            Connecting...

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             ROLE HEADER
             ================================================= -->

        <section class="roles-header">

            <h1>
                🎭 ROLE ASSIGNMENT
            </h1>


            <p
                id="roleAnimeTitle"
                class="role-status">

                One Piece

            </p>


            <div
                id="roleCounter"
                class="role-counter">

                0 / 6 Roles Assigned

            </div>

        </section>


        <!-- =================================================
             PRIVATE TEAM
             ================================================= -->

        <section
            id="roleContainer"
            data-role-container>

            <!--

                roles.js generates the six character cards.

                IMPORTANT:

                Only the current player's six characters
                are sent to this page.

                The opponent's team and roles are never
                rendered here.

            -->

        </section>


        <!-- =================================================
             VALIDATION
             ================================================= -->

        <div
            id="roleValidation"
            data-role-validation
            class="invalid">

            Assign all six unique roles to continue.

        </div>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <section class="roles-actions">


            <button
                id="backToDraftButton"
                class="adg-button secondary"
                type="button">

                ← Back

            </button>


            <button
                id="continueBattleButton"
                class="adg-button"
                type="button"
                disabled>

                Continue → Battle Arena

            </button>

        </section>


        <!-- =================================================
             SOUND CONTROL
             ================================================= -->

        <div
            class="sound-control"
            style="width:max-content;margin:25px auto 0;">

            <span data-volume-icon>
                🔊
            </span>


            <input
                type="range"
                min="0"
                max="100"
                value="65"
                aria-label="Master volume"
                data-master-volume>


            <span data-volume-value>
                65%
            </span>


            <button
                type="button"
                aria-label="Mute"
                aria-pressed="false"
                data-mute-button>

                🔊

            </button>

        </div>

    </main>


    <!-- =====================================================
         GLOBAL MESSAGE
         ===================================================== -->

    <div
        id="adgMessage"
        class="adg-message hidden"
        role="status"
        aria-live="polite">

    </div>


    <!-- =====================================================
         SOCKET.IO
         ===================================================== -->

    <script
        src="/socket.io/socket.io.js">
    </script>


    <!-- =====================================================
         GAME DATABASE
         ===================================================== -->

    <script
        src="js/database.js">
    </script>


    <!-- =====================================================
         SOUND
         ===================================================== -->

    <script
        src="js/sound.js">
    </script>


    <!-- =====================================================
         ROLE ENGINE
         ===================================================== -->

    <script
        src="js/roles.js">
    </script>

</body>

</html>
```
